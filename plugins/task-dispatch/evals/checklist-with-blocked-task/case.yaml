schema_version: "1.1"
name: checklist-with-blocked-task
description: Works through a three-item checklist with a fresh worker per task, leaves the task with a missing spec open, and reports in the closing summary shape.
tags: [checklist, orchestration]
runs: 1
expected_outcome: T1 and T2 are committed with Task trailers and ticked in their own commits; T3 stays unticked and is listed under Blocked with a Need line; nothing is pushed.

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Work through the open tasks in docs/plans/2026-10-11-calc-extensions.md.
    Use subagents so this context window stays clean, and report back when done.
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite]

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?task-dispatch"'

  - name: dispatched-task-worker
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:task-dispatch:)?task-worker"'
    min: 2
    arm: with-only

  - name: t1-ticked
    type: regex
    pattern: '^- \[x\] T1:'
    flags: m
    target: { source: file, path: docs/plans/2026-10-11-calc-extensions.md }

  - name: t3-left-open
    type: regex
    pattern: '^- \[ \] T3:'
    flags: m
    target: { source: file, path: docs/plans/2026-10-11-calc-extensions.md }
    weight: 2

  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0

  - name: summary-reports-blocked
    type: regex
    pattern: 'BLOCKED'
    target: last_message

  - name: summary-shape
    type: llm
    focus: last_message
    criteria: |
      PASS if the final message contains a table with one row per task (T1,
      T2, T3) showing a status and a commit, a "Blocked" part that names T3
      and the missing docs/spec.md, and a line about the branch state. FAIL if
      T3 is reported as done, or if the message asks the reader to choose
      between pushing and merging without first giving that summary.
